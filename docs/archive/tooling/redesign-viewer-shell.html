<style>
  #navodhai-review { width:100%; font-family:var(--font-sans, sans-serif); color:var(--foreground); }
  #navodhai-review .review-toolbar { display:flex; flex-wrap:wrap; align-items:center; gap:8px; margin-bottom:16px; }
  #navodhai-review .review-toolbar button { min-height:44px; padding:8px 16px; border:1px solid var(--border); border-radius:6px; background:var(--background); color:var(--foreground); font:inherit; }
  #navodhai-review .review-toolbar button[aria-pressed=true] { background:var(--primary); color:var(--primary-foreground); border-color:var(--primary); }
  #navodhai-review .review-toolbar span { margin-left:auto; font-size:12px; color:var(--muted-foreground); }
  #navodhai-review .review-space { width:100%; }
  #navodhai-review .review-stage { position:relative; margin-inline:auto; }
  #navodhai-review iframe { display:block; position:absolute; top:0; left:0; border:0; transform-origin:0 0; background:#fff; }
  @media(max-width:450px) { #navodhai-review .review-toolbar span { width:100%; margin-left:0; } }
</style>
<div id="navodhai-review" aria-label="High-fidelity Navodhai desktop and phone design review">
  <div class="review-toolbar" aria-label="Review viewport">
    <button type="button" data-mode="desktop" aria-pressed="true">Desktop</button>
    <button type="button" data-mode="phone" aria-pressed="false">Phone</button>
    <span>Scroll inside the design to explore.</span>
  </div>
  <div class="review-space"><div class="review-stage">
    <iframe title="Navodhai interactive high-fidelity design" sandbox="allow-scripts allow-popups allow-popups-to-escape-sandbox allow-top-navigation-by-user-activation" width="1440" height="900" srcdoc="<!-- PAGE_SOURCE -->"></iframe>
  </div></div>
</div>
<script>
(() => {
  const root = document.getElementById('navodhai-review');
  const space = root.querySelector('.review-space');
  const stage = root.querySelector('.review-stage');
  const frame = root.querySelector('iframe');
  let mode = root.clientWidth < 500 ? 'phone' : 'desktop';
  function render() {
    const width = mode === 'phone' ? 390 : 1440;
    const height = mode === 'phone' ? 844 : 900;
    const scale = Math.min(1, space.clientWidth / width);
    frame.style.width = width + 'px';
    frame.style.height = height + 'px';
    frame.style.transform = `scale(${scale})`;
    stage.style.width = width * scale + 'px';
    stage.style.height = height * scale + 'px';
    root.querySelectorAll('[data-mode]').forEach(button => button.setAttribute('aria-pressed', String(button.dataset.mode === mode)));
  }
  root.querySelectorAll('[data-mode]').forEach(button => button.addEventListener('click', () => { mode = button.dataset.mode; render(); }));
  new ResizeObserver(render).observe(space);
  render();
})();
</script>
